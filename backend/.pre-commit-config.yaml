# Pre-commit: линтеры и проверки типов (mypy — мягко, не блокирует)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        args: [--config-file, backend/pyproject.toml]
        additional_dependencies: []
  # docker-compose.yml — валидный YAML (быстрая проверка без yamllint)
  - repo: local
    hooks:
      - id: compose-yaml
        name: docker-compose.yml валиден (yaml.safe_load)
        language: python
        additional_dependencies: [pyyaml]
        entry: python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in sys.argv[1:]]; print('compose-yaml: ok')"
        files: ^backend/docker-compose\.yml$
