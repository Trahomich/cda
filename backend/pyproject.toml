[project]
name = "cda-backend"
version = "0.1.0"
description = "ИС «Цифровой двойник агронома» (ЦДА) — backend MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "geoalchemy2>=0.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10,<4",
    "httpx[socks]>=0.27", # рантайм: адаптеры Open-Meteo / Copernicus; socks — обход DPI для api.open-meteo (через ALL_PROXY, см. deploy/README)
    # Растровая обработка Sentinel-2 (MVP-10). Верхние границы — из-за CPU
    # окружения (без SSE4.2): numpy>=2.4/shapely>=2.1/rasterio>=1.4 падают
    # с SIGILL; версии ниже работают и совместимы с Python 3.12/3.13.
    "numpy>=2.1,<2.4",
    "shapely>=2.0.6,<2.1",
    "rasterio>=1.3.11,<1.4",
    # чтение SHP/DBF для файлового импорта полей (v1-02, IF-FIELDS)
    "pyshp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 отключён: вызов Depends() в значениях по умолчанию — идиоматичный FastAPI
ignore = ["B008"]

[tool.mypy]
# «мягкий» режим: предупреждаем, но не блокируем PR на этапе MVP
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# Сборка пакета (Dockerfile: pip install . — зависимости берутся из [project])
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# пакет приложения — app/ (имя проекта cda-backend не совпадает с папкой)
packages = ["app"]
