# Прод-стек ЦДА (сервер cda@192.168.99.201, каталог ~/cda).
# Секреты — в ../.env на сервере (вне git): POSTGRES_PASSWORD, JWT_SECRET.
# 2026-11-07: туннель Cloudflare, fragrelay-релеи и SOCKS-прокси исключены из
# схемы по решению пользователя; публикация — LAN http://192.168.99.201:8080
# (новый способ публикации наружу определяется отдельно).
# Запуск: docker compose -f docker-compose.prod.yml --env-file ../.env up -d --build
# Подробности: docs/deploy/README.md

services:
  api:
    build: ../backend
    image: cda/api:latest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      ENV: prod
      WEATHER_POLL_ENABLED: "false" # опрос погоды перенесён в воркер weather-ingest (ADR-09)
      NDVI_RENDER_DIR: /var/lib/cda/ndvi-renders # §7.3: отдача PNG-рендеров сцен
      # 2026-11-07: SOCKS-прокси исключён по решению пользователя; исходящие
      # httpx-запросы идут напрямую. Если периметр снова начнёт резать
      # api.open-meteo.com / earth-search — вернуть ALL_PROXY (см. docs/deploy/README.md).
    volumes:
      - ndvi-renders:/var/lib/cda/ndvi-renders:ro # пишет sentinel-ingest (#83)
    ports:
      - "127.0.0.1:8000:8000" # только локально для проверок; наружу — через туннель
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Воркер приёма погоды Open-Meteo (ADR-09, v1-03): тот же образ, без API
  # наружу; джобы current/forecast/archive по расписанию 05 §4 (env INGEST_*)
  weather-ingest:
    image: cda/api:latest
    command: python -m app.services.weather_ingest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      INGEST_WEATHER_CURRENT_MINUTES: "30"
      INGEST_WEATHER_FORECAST_HOURS: "3"
      INGEST_WEATHER_ARCHIVE_MINUTES: "60"
      INGEST_WEATHER_BACKFILL_DAYS: "14"
      # 2026-11-07: SOCKS-прокси исключён по решению пользователя; исходящие
      # httpx-запросы идут напрямую (см. docs/deploy/README.md).
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  # Воркер каталогизации Sentinel-2 (ADR-09, v1-04): STAC earth-search → БД,
  # NDVI по COG-окнам полей (анонимно, без кредов Copernicus); опрос каталога
  # раз в 6 ч, окно backfill — 1 год (углубление NDVI-истории, #259/#261);
  # env INGEST_SATELLITE_*
  sentinel-ingest:
    image: cda/api:latest
    command: python -m app.services.sentinel_ingest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      STAC_API_URL: https://earth-search.aws.element84.com/v1
      INGEST_SATELLITE_CATALOG_HOURS: "6"
      INGEST_SATELLITE_BACKFILL_DAYS: "365"
      # Годовой backfill (#265): больше строк за цикл и потоков чтения COG
      INGEST_SATELLITE_NDVI_BATCH: "500"
      INGEST_SATELLITE_NDVI_WORKERS: "8"
      NDVI_RENDER_DIR: /var/lib/cda/ndvi-renders # §7.3: PNG-рендеры сцен (ndvi/truecolor)
      # 2026-11-07: SOCKS-прокси исключён по решению пользователя; исходящие
      # httpx-запросы идут напрямую (см. docs/deploy/README.md).
    volumes:
      - ndvi-renders:/var/lib/cda/ndvi-renders # api читает этот volume (ro)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cda}
      POSTGRES_USER: ${POSTGRES_USER:-cda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в .env}
    volumes:
      - pgdata:/var/lib/postgresql # PG18: маунт на родителя, данные в подкаталоге версии
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cda} -d ${POSTGRES_DB:-cda}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# Примечание: порт 5432 не публикуется. Для дымовых тестов (make smoke),
# которым нужен прямой доступ к БД, используется SSH-туннель через сервер:
# ssh -N -L 15432:127.0.0.1:5432 cda@192.168.99.201 + временная публикация
# 127.0.0.1:5432:5432 у сервиса db (убрать после теста).

  # 2026-11-07 (#86): Redis заменён на DragonflyDB (Redis-совместимый протокол,
  # порт 6379). Используется только как APScheduler RedisJobStore; джобы
  # перерегистрируются при старте (replace_existing=True), миграция данных не нужна.
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["dragonfly", "--logtostderr", "--dbfilename=dragonfly", "--dir=/data"]
    volumes:
      - dragonflydata:/data
    healthcheck:
      # в образе нет redis-cli; проверяем TCP 6379 через bash /dev/tcp
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6379'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080" # доступ: LAN http://192.168.99.201:8080 (туннель Cloudflare удалён 2026-11-07)
    volumes:
      - ../frontend/dist:/srv/frontend:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  dragonflydata: # #86: данные DragonflyDB (снапшоты); старый redisdata удалён на стенде
  ndvi-renders: # §7.3 (#83): PNG-рендеры сцен; пишет sentinel-ingest, читает api (ro)
