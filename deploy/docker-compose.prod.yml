# Прод-стек ЦДА (сервер cda@192.168.99.201, каталог ~/cda).
# Секреты — в ../.env на сервере (вне git): POSTGRES_PASSWORD, JWT_SECRET, TUNNEL_TOKEN.
# Запуск: docker compose -f docker-compose.prod.yml --env-file ../.env up -d --build
# Подробности: docs/deploy/README.md

services:
  api:
    build: ../backend
    image: cda/api:latest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      ENV: prod
      WEATHER_POLL_ENABLED: "false" # опрос погоды перенесён в воркер weather-ingest (ADR-09)
      # api.open-meteo.com (157.90.83.168) блокируется DPI периметра — исходящие
      # запросы httpx ( прогноз по требованию) идут через SOCKS-прокси пользователя
      ALL_PROXY: socks5://${SOCKS_HOST:-192.168.99.45}:${SOCKS_PORT:-1080}
    ports:
      - "127.0.0.1:8000:8000" # только локально для проверок; наружу — через туннель
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Воркер приёма погоды Open-Meteo (ADR-09, v1-03): тот же образ, без API
  # наружу; джобы current/forecast/archive по расписанию 05 §4 (env INGEST_*)
  weather-ingest:
    image: cda/api:latest
    command: python -m app.services.weather_ingest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      INGEST_WEATHER_CURRENT_MINUTES: "30"
      INGEST_WEATHER_FORECAST_HOURS: "3"
      INGEST_WEATHER_ARCHIVE_MINUTES: "60"
      INGEST_WEATHER_BACKFILL_DAYS: "14"
      # api.open-meteo.com блокируется DPI (архивный API — нет): весь исходящий
      # httpx-трафик воркера через SOCKS-прокси пользователя; см. deploy/README
      ALL_PROXY: socks5://${SOCKS_HOST:-192.168.99.45}:${SOCKS_PORT:-1080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  # Воркер каталогизации Sentinel-2 (ADR-09, v1-04): STAC earth-search → БД,
  # NDVI по COG-окнам полей (анонимно, без кредов Copernicus); опрос каталога
  # раз в 6 ч, окно backfill 14 дней (05 §4); env INGEST_SATELLITE_*
  sentinel-ingest:
    image: cda/api:latest
    command: python -m app.services.sentinel_ingest
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      STAC_API_URL: https://earth-search.aws.element84.com/v1
      INGEST_SATELLITE_CATALOG_HOURS: "6"
      INGEST_SATELLITE_BACKFILL_DAYS: "14"
      # POST /search к earth-search душится периметром напрямую (>60 c против
      # ~2 c через прокси, 2026-11-06) — исходящий httpx через SOCKS, см. deploy/README
      ALL_PROXY: socks5://${SOCKS_HOST:-192.168.99.45}:${SOCKS_PORT:-1080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cda}
      POSTGRES_USER: ${POSTGRES_USER:-cda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в .env}
    volumes:
      - pgdata:/var/lib/postgresql # PG18: маунт на родителя, данные в подкаталоге версии
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cda} -d ${POSTGRES_DB:-cda}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# Примечание: порт 5432 не публикуется. Для дымовых тестов (make smoke),
# которым нужен прямой доступ к БД, используется SSH-туннель через сервер:
# ssh -N -L 15432:127.0.0.1:5432 cda@192.168.99.201 + временная публикация
# 127.0.0.1:5432:5432 у сервиса db (убрать после теста).

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080" # LAN-доступ (решение от 2026-11-06): MVP доступен по http://192.168.99.201:8080; наружу в интернет — через cloudflared
    volumes:
      - ../frontend/dist:/srv/frontend:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped

  # Прокси/fragrelay ИСКЛЮЧЕНЫ из схемы по решению пользователя (2026-11-07):
  # cloudflared подключается к edge напрямую; исходящие httpx-запросы сервисов
  # (api, weather-ingest, sentinel-ingest) тоже идут напрямую, без ALL_PROXY.
  # История решения: docs/deploy/README.md (раздел про обход DPI).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN обязателен в .env}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
