<!doctype html>
<html lang="ru">

        margin: 0;

    <div class="card">
      <h1>Нет подключения к сети</h1>

        Офлайн-режим ЦДА: загруженные экраны работают, новые данные обновятся, когда появится

      </p>
    </div>
